<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ 完整影片預覽</title><style>
/* === Review interface; the video itself is the fixed 1600 × 900 stage === */
*{box-sizing:border-box}body{margin:0;background:#e8e9eb;color:#17212b;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}main{max-width:1280px;margin:auto;padding:28px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:24px;margin:0}header span,.notes{color:#56616f;font-size:14px}.stage{aspect-ratio:16/9;background:#111722;overflow:hidden}video{display:block;width:100%;height:100%;object-fit:contain}#caption{font-size:21px;min-height:78px;display:grid;place-content:center;text-align:center;margin:8px auto;max-width:1000px}nav{display:flex;gap:10px;align-items:center}button{font:inherit;border:1px solid #b7bec8;background:#fff;border-radius:4px;padding:8px 14px;color:#17212b;cursor:pointer}button:hover{background:#e7edff}button:focus-visible,input:focus-visible{outline:2px solid #315ff4;outline-offset:3px}#play{background:#17212b;color:white;border-color:#17212b}#seek{flex:1;accent-color:#315ff4}#clock{font-variant-numeric:tabular-nums;font-size:14px}.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chapters button{font-size:13px}.chapters button.active{border-color:#315ff4;background:#e7edff;color:#2549ce}.notes{line-height:1.8}a{color:#2549ce;text-underline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}.grid figure{margin:0}.grid img{width:100%;aspect-ratio:16/9;object-fit:contain}.grid figcaption{font-size:13px;margin:6px 0 12px}::selection{background:#c8d5ff;color:#17212b}@media(max-width:700px){main{padding:12px}header{display:block}h1{font-size:19px}#caption{font-size:16px}nav{flex-wrap:wrap}#seek{min-width:100px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><main><header><h1>__TITLE__ · __DURATION__ 秒完整影片</h1><span>ElevenLabs 正式配音 · 九幕美術更新</span></header><div class="stage"><video id="video" playsinline preload="auto" poster="../中間產物/靜幀/00.png?v=__REV__" src="../輸出/影片.mp4?v=__REV__"></video></div><div id="caption" aria-live="off"></div><nav><button id="play" disabled>載入中</button><button id="restart">重播</button><input id="seek" aria-label="播放進度" type="range" min="0" max="__TOTAL__" step="0.04" value="0"><span id="clock">0:00 / 1:53</span><button id="fullscreen">全螢幕</button></nav><div class="chapters" id="chapters"></div><p class="notes">本頁直接播放輸出的 MP4；聚焦、路徑與畫面切換均已編碼在影片內。<br><a href="腳本與分鏡.md">腳本與分鏡</a> · <a href="證據對照.md">證據對照</a> · <a href="../輸出/影片.mp4?v=__REV__">開啟 MP4</a></p><div class="grid">__GALLERY__</div></main><script>
/* === Transport and chapters; visual animation comes from the same MP4 === */
const rows=__ROWS__,cues=__CUES__,video=document.getElementById('video'),play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),caption=document.getElementById('caption'),chapters=document.getElementById('chapters');const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
rows.forEach((r,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+r.title;b.onclick=()=>{video.currentTime=r.start;draw()};chapters.append(b)});
function draw(){const t=video.currentTime;seek.value=t;clock.textContent=fmt(t)+' / '+fmt(rows.at(-1).end);caption.textContent=(cues.find(c=>t>=c.start&&t<c.end)||{}).text||'';const i=rows.findIndex(r=>t>=r.start&&t<r.end);Array.from(chapters.children).forEach((b,j)=>b.classList.toggle('active',i===j));}
play.onclick=async()=>{try{if(video.paused){if(video.ended)video.currentTime=0;await video.play()}else video.pause()}catch(e){console.error('preview-play',e.name,e.message);caption.textContent='無法播放，請使用下方「開啟 MP4」。'}};document.getElementById('restart').onclick=()=>{video.currentTime=0;draw()};document.getElementById('fullscreen').onclick=()=>video.requestFullscreen();document.addEventListener('fullscreenchange',()=>{video.controls=Boolean(document.fullscreenElement)});seek.oninput=()=>{video.currentTime=Number(seek.value);draw()};video.oncanplay=()=>{play.disabled=false;play.textContent=video.paused?'播放':'暫停'};video.onerror=()=>{caption.textContent='影片載入失敗，請重新整理或開啟下方 MP4。'};if(video.readyState>=3){play.disabled=false;play.textContent='播放'};video.ontimeupdate=draw;video.onseeked=draw;video.onplay=()=>play.textContent='暫停';video.onpause=()=>play.textContent='播放';video.onended=draw;draw();
</script></html>
