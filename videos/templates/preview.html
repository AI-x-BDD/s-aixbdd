<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ __DURATION__ 秒計時預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ebe6;color:#172b35;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}main{max-width:1240px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:22px;margin:0}header span{font-size:14px;color:#536975}.stage{position:relative;aspect-ratio:16/9;background:#f5f3ed;box-shadow:0 12px 45px #172b3518;overflow:hidden;border-radius:10px}.stage img{display:block;width:100%;height:100%}.focus{position:absolute;display:none;border:3px solid #ba582d;border-radius:12px;pointer-events:none;transition:all .25s ease}#caption{font-size:20px;line-height:1.6;min-height:70px;display:grid;place-content:center;text-align:center;max-width:900px;margin:10px auto}nav{display:flex;gap:10px;align-items:center}button{font:inherit;border:1px solid #bdcbc6;background:white;border-radius:8px;padding:9px 15px;color:#172b35;cursor:pointer}button:hover{background:#dfede6}#play{background:#0a756a;color:white;border-color:#0a756a}#seek{flex:1;accent-color:#0a756a}#clock{font-variant-numeric:tabular-nums;font-size:14px}.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chapters button{font-size:13px}.chapters button.active{border-color:#0a756a;background:#dfede6}.notes{font-size:14px;line-height:1.7;color:#536975}a{color:#0a756a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.grid figure{margin:0}.grid img{width:100%;border-radius:7px}.grid figcaption{font-size:13px;margin:5px 0 15px}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}header{display:block}h1{font-size:18px}#caption{font-size:16px}nav{flex-wrap:wrap}#seek{min-width:120px}}
</style><main><header><h1>__TITLE__ · __DURATION__ 秒計時預覽</h1><span>靜幀＋臨時系統語音</span></header><div class="stage"><img id="frame" src="靜幀/01.png" alt="由 primitives 組成 __TITLE__"><div class="focus" id="focus"></div></div><div id="caption" aria-live="off"></div><nav><button id="play">播放</button><button id="restart">重播</button><input id="seek" aria-label="播放進度" type="range" min="0" max="__TOTAL__" step="0.1" value="0"><span id="clock">0:00 / __CLOCK__</span></nav><div class="chapters" id="chapters"></div><p class="notes">依旁白與畫面檢查敘事節奏。聲音為本機 Meijia 臨時語音；字幕為段內估時稿。可跳段、拖曳及暫停比較。<br><a href="腳本與分鏡.md">腳本與分鏡</a> · <a href="證據對照.md">證據對照</a> · <a href="計時預覽.mp4">MP4</a></p><div class="grid">__GALLERY__</div><audio id="audio" preload="metadata" src="臨時旁白.mp3"></audio></main><script>
const rows=__ROWS__,cues=__CUES__,focusCues=__FOCUS__;const duration=rows.at(-1).end;const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');const audio=document.getElementById('audio'),frame=document.getElementById('frame'),focus=document.getElementById('focus'),play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),caption=document.getElementById('caption');const chapters=document.getElementById('chapters');
rows.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.title;b.onclick=()=>{audio.currentTime=r.start;draw()};chapters.append(b)});
function rect(x,y,w,h){focus.style.display='block';focus.style.left=x/16+'%';focus.style.top=y/9+'%';focus.style.width=w/16+'%';focus.style.height=h/9+'%'}
function draw(){const t=audio.currentTime;const found=rows.findIndex(r=>t>=r.start&&t<r.end);const i=found<0?rows.length-1:found;const r=rows[i];const src='靜幀/'+r.frame+'.png';if(frame.getAttribute('src')!==src)frame.src=src;frame.alt=r.title;seek.value=t;clock.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / __CLOCK__';caption.textContent=(cues.find(c=>t>=c.start&&t<c.end)||{}).text||'';Array.from(chapters.children).forEach((b,j)=>b.classList.toggle('active',i===j));focus.style.display='none';const f=focusCues.find(c=>t>=c.start&&t<c.end);if(f)rect(...f.box);}
play.onclick=async()=>{try{if(audio.paused){if(audio.currentTime>=duration-.1)audio.currentTime=0;await audio.play()}else audio.pause()}catch(e){caption.textContent='聲音無法播放，請使用同目錄的 MP4 預覽。'}};document.getElementById('restart').onclick=()=>{audio.currentTime=0;draw()};seek.oninput=()=>{audio.currentTime=Number(seek.value);draw()};audio.ontimeupdate=draw;audio.onplay=()=>play.textContent='暫停';audio.onpause=()=>play.textContent='播放';audio.onended=()=>{audio.pause();seek.value=duration;clock.textContent=fmt(duration)+' / '+fmt(duration);focus.style.display='none'};draw();
</script></html>
