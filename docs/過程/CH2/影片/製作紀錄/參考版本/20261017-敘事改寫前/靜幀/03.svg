<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#0A756A"/></marker></defs><g font-family="PingFang TC, Heiti TC, sans-serif"><rect width="1600" height="900" fill="#F5F3ED"/><text x="88" y="142" font-size="48" fill="#172B35" font-weight="650">Engineering 決定工作，primitives 負責施工</text><text x="88" y="190" font-size="26" fill="#536975" font-weight="400">以下是調度規則；各部位依步驟需要選用</text><path d="M88 818 L1512 818" stroke="#D5DCD8" stroke-width="3" fill="none"/><text x="1370" y="858" font-size="23" fill="#536975" font-weight="400">03 / 06</text><rect x="88" y="228" width="410" height="107" rx="18" fill="#172B35" stroke="#172B35"/><text x="110" y="273" font-size="30" fill="white" font-weight="600">定義預期</text><text x="110" y="312" font-size="23" fill="#B7D5CF" font-weight="400">新建 / 優化</text><rect x="595" y="228" width="410" height="107" rx="18" fill="#172B35" stroke="#172B35"/><text x="617" y="273" font-size="30" fill="white" font-weight="600">確認問題與根因</text><text x="617" y="312" font-size="23" fill="#B7D5CF" font-weight="400">優化模式才走這一步</text><rect x="1102" y="228" width="410" height="107" rx="18" fill="#172B35" stroke="#172B35"/><text x="1124" y="273" font-size="30" fill="white" font-weight="600">確認工程藍圖</text><text x="1124" y="312" font-size="23" fill="#B7D5CF" font-weight="400">依工作項分派</text><path d="M515 281 L577 281" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1023 281 L1084 281" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="88" y="425" width="310" height="199" rx="18" fill="#DFEDE6" stroke="#D5DCD8"/><text x="112" y="475" font-size="33" fill="#0A756A" font-weight="600">先整理 SOP</text><text x="112" y="523" font-size="28" fill="#172B35" font-weight="400">skill-form-sop</text><text x="112" y="576" font-size="20" fill="#536975" font-weight="400">尚待抽出的內容先留在步驟</text><path d="M411 518 L452 518" stroke="#0A756A" stroke-width="3" fill="none"/><path d="M452 427 L452 667" stroke="#0A756A" stroke-width="3" fill="none"/><path d="M452 427 L480 427" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M452 547 L480 547" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M452 667 L480 667" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="495" y="378" width="294" height="96" rx="18" fill="white" stroke="#D5DCD8"/><text x="513" y="410" font-size="23" fill="#536975" font-weight="400">需要判斷規則</text><text x="513" y="449" font-size="24" fill="#0A756A" font-weight="600">skill-derive-rule</text><path d="M800 427 L854 427" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="871" y="378" width="275" height="96" rx="18" fill="white" stroke="#D5DCD8"/><text x="890" y="435" font-size="24" fill="#172B35" font-weight="600">skill-form-rule</text><rect x="495" y="498" width="294" height="96" rx="18" fill="white" stroke="#D5DCD8"/><text x="513" y="530" font-size="23" fill="#536975" font-weight="400">需要固定輸出</text><text x="513" y="569" font-size="24" fill="#0A756A" font-weight="600">skill-derive-template</text><path d="M800 547 L854 547" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="871" y="498" width="275" height="96" rx="18" fill="white" stroke="#D5DCD8"/><text x="890" y="555" font-size="24" fill="#172B35" font-weight="600">skill-form-template</text><rect x="495" y="618" width="294" height="96" rx="18" fill="white" stroke="#D5DCD8"/><text x="513" y="650" font-size="23" fill="#536975" font-weight="400">可交給腳本自動處理</text><text x="513" y="689" font-size="24" fill="#0A756A" font-weight="600">skill-derive-script</text><path d="M800 667 L854 667" stroke="#0A756A" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="871" y="618" width="275" height="96" rx="18" fill="white"