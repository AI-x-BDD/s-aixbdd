<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#0A756A"/></marker></defs><g font-family="PingFang TC, Heiti TC, sans-serif"><rect width="1600" height="900" fill="#F5F3ED"/><text x="88" y="138" font-size="48" fill="#172B35" font-weight="650">先把工作分清楚，再交給對的技能</text><text x="88" y="193" font-size="27" fill="#536975" font-weight="400">我做的 Skill Engineering，同時處理建立與優化</text><rect x="88" y="326" width="290" height="238" rx="18" fill="white" stroke="#D5DCD8"/><text x="122" y="396" font-size="30" fill="#0A756A" font-weight="600">建立 / 優化</text><text x="122" y="469" font-size="43" fill="#172B35" font-weight="600">一支 Skill</text><path d="M397 445 L465 445" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="485" y="286" width="600" height="318" rx="18" fill="#172B35" stroke="#172B35"/><text x="528" y="367" font-size="48" fill="white" font-weight="600">Skill Engineering</text><text x="528" y="439" font-size="32" fill="#B7D5CF" font-weight="400">釐清需求 → 排出工作</text><text x="528" y="518" font-size="35" fill="white" font-weight="400">依工作委派基礎技能</text><path d="M1105 445 L1171 445" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1192" y="326" width="320" height="238" rx="18" fill="#DFEDE6" stroke="#D5DCD8"/><text x="1225" y="403" font-size="34" fill="#0A756A" font-weight="600">改寫後的</text><text x="1225" y="477" font-size="48" fill="#172B35" font-weight="600">Skill</text><text x="88" y="748" font-size="34" fill="#536975" font-weight="400">看分工，也看三支技能改寫後的結構。</text></g></svg>