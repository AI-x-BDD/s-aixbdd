<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC, Avenir Next, sans-serif"><rect width="1600" height="900" fill="#F7F5F0" /><text x="88" y="112" font-size="48" fill="#17212B" font-weight="650">檔案拆出去，流程也要接回來</text><text x="88" y="166" font-size="28" fill="#626D7A" font-weight="500">以新增規則為例，看一次完整的委派</text><g data-focus="s0"><text x="88" y="303" font-size="44" fill="#315FF4" font-weight="650" data-active-fill="#234DCB">抽取規則</text><text x="88" y="352" font-size="29" fill="#626D7A" font-weight="500">skill-derive-rule</text><path d="M88 389H448L482 423V562H88Z" fill="none" stroke="#CFD6DF" stroke-width="2" data-active-fill="#E7EDFF" data-active-stroke="#315FF4" /><path d="M448 389V423H482" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="108" y="504.91" font-size="34" fill="#17212B" font-weight="600" data-active-fill="#234DCB">SOP Step</text><text x="108" y="608" font-size="31" fill="#17212B" font-weight="600" data-active-fill="#234DCB">判斷要抽出哪些規則</text><text x="108" y="653" font-size="28" fill="#626D7A" font-weight="500">接手 SOP 的指定步驟</text><path d="M502 468H562m-14 -10l14 10 -14 10" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="s1"><text x="588" y="303" font-size="44" fill="#315FF4" font-weight="650" data-active-fill="#234DCB">寫好規則</text><text x="588" y="352" font-size="29" fill="#626D7A" font-weight="500">skill-form-rule</text><path d="M588 389H948L982 423V562H588Z" fill="none" stroke="#CFD6DF" stroke-width="2" data-active-fill="#E7EDFF" data-active-stroke="#315FF4" /><path d="M948 389V423H982" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="608" y="504.91" font-size="34" fill="#17212B" font-weight="600" data-active-fill="#234DCB">rules/</text><text x="608" y="608" font-size="31" fill="#17212B" font-weight="600" data-active-fill="#234DCB">獨立規則檔</text><text x="608" y="653" font-size="28" fill="#626D7A" font-weight="500">每條都有正反例</text><path d="M1002 468H1062m-14 -10l14 10 -14 10" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="s2"><text x="1088" y="303" font-size="44" fill="#315FF4" font-weight="650" data-active-fill="#234DCB">更新流程</text><text x="1088" y="352" font-size="29" fill="#626D7A" font-weight="500">skill-form-sop</text><path d="M1088 389H1448L1482 423V562H1088Z" fill="none" stroke="#CFD6DF" stroke-width="2" data-active-fill="#E7EDFF" data-active-stroke="#315FF4" /><path d="M1448 389V423H1482" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="1108" y="504.91" font-size="34" fill="#17212B" font-weight="600" data-active-fill="#234DCB">SOP</text><text x="1108" y="608" font-size="31" fill="#17212B" font-weight="600" data-active-fill="#234DCB">在適用步驟讀取</text><text x="1108" y="653" font-size="28" fill="#626D7A" font-weight="500">後續使用並檢查</text></g><g data-focus="branches"><rect x="68" y="724" width="920" height="116" rx="12" fill="#E7EDFF" data-active-only="branches" /><path d="M88 710H934" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="88" y="765" font-size="30" fill="#17212B" font-weight="500">固定輸出 → 樣板抽取</text><text x="88" y="814" font-size="30" fill="#17212B" font-weight="500">可交給腳本自動處理 → 腳本抽取</text></g><g data-focus="existing"><rect x="1038" y="718" width="474" height="116" fill="#E7EDFF" stroke="none" data-active-only="existing" /><text x="1060" y="760" font-size="30" fill="#17212B" font-weight="600">既有部位只改內容</text><text x="1060" y="807" font-size="30" fill="#315FF4" font-weight="500">直接交給對應 Form</text></g></g></svg>