<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC, Avenir Next, sans-serif"><rect width="1600" height="900" fill="#F7F5F0" /><text x="88" y="112" font-size="48" fill="#17212B" font-weight="650">優化時，先找原因，再決定改哪裡</text><text x="88" y="166" font-size="28" fill="#626D7A" font-weight="500">確認根因與工程藍圖後，才開始修改</text><g data-focus="s0"><rect x="68" y="262" width="342" height="360" rx="16" fill="#E7EDFF" data-active-only="s0" /><text x="88" y="307" font-size="26" fill="#315FF4" font-weight="600">01</text><circle cx="96" cy="375" r="10" fill="#315FF4" data-active-fill="#234DCB" /><text x="88" y="448" font-size="37" fill="#17212B" font-weight="650" data-active-fill="#234DCB">釐清預期</text><text x="88" y="520" font-size="29" fill="#17212B" font-weight="500">哪裡不滿意？</text><text x="88" y="569" font-size="28" fill="#626D7A" font-weight="500">原本期待什麼？</text><path d="M116 375H430" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="s1"><rect x="444" y="262" width="342" height="360" rx="16" fill="#E7EDFF" data-active-only="s1" /><text x="464" y="307" font-size="26" fill="#315FF4" font-weight="600">02</text><circle cx="472" cy="375" r="10" fill="#315FF4" data-active-fill="#234DCB" /><text x="464" y="448" font-size="37" fill="#17212B" font-weight="650" data-active-fill="#234DCB">確認根因</text><text x="464" y="520" font-size="29" fill="#17212B" font-weight="500">落差出在哪裡？</text><text x="464" y="569" font-size="28" fill="#626D7A" font-weight="500">先確認原因</text><path d="M492 375H806" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="s2"><rect x="820" y="262" width="342" height="360" rx="16" fill="#E7EDFF" data-active-only="s2" /><text x="840" y="307" font-size="26" fill="#315FF4" font-weight="600">03</text><circle cx="848" cy="375" r="10" fill="#315FF4" data-active-fill="#234DCB" /><text x="840" y="448" font-size="37" fill="#17212B" font-weight="650" data-active-fill="#234DCB">確認工程藍圖</text><text x="840" y="520" font-size="29" fill="#17212B" font-weight="500">要改哪些部位？</text><text x="840" y="569" font-size="28" fill="#626D7A" font-weight="500">先確認修改計畫</text><path d="M868 375H1182" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="s3"><rect x="1196" y="262" width="342" height="360" rx="16" fill="#E7EDFF" data-active-only="s3" /><text x="1216" y="307" font-size="26" fill="#315FF4" font-weight="600">04</text><circle cx="1224" cy="375" r="10" fill="#315FF4" data-active-fill="#234DCB" /><text x="1216" y="448" font-size="37" fill="#17212B" font-weight="650" data-active-fill="#234DCB">整理 SOP</text><text x="1216" y="520" font-size="29" fill="#17212B" font-weight="500">每一步需要什麼？</text><text x="1216" y="569" font-size="28" fill="#626D7A" font-weight="500">逐步安排施工</text></g><text x="88" y="785" font-size="31" fill="#626D7A" font-weight="500">根因決定要改什麼，工程藍圖決定怎麼分派。</text></g></svg>