<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#0A756A"/></marker></defs><g font-family="PingFang TC, Heiti TC, sans-serif"><rect width="1600" height="900" fill="#F5F3ED"/><text x="88" y="138" font-size="48" fill="#172B35" font-weight="650">優化時，先找原因，再決定改哪裡</text><text x="88" y="193" font-size="27" fill="#536975" font-weight="400">確認根因與工程藍圖後，才開始修改</text><rect x="88" y="316" width="310" height="240" rx="18" fill="#172B35" stroke="#172B35"/><text x="113" y="363" font-size="25" fill="#B7D5CF" font-weight="400">01</text><text x="113" y="422" font-size="31" fill="white" font-weight="600">釐清預期</text><text x="113" y="484" font-size="26" fill="#B7D5CF" font-weight="400">哪裡不滿意？</text><text x="113" y="524" font-size="25" fill="#B7D5CF" font-weight="400">原本期待什麼？</text><path d="M407 440 L437 440" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="450" y="316" width="310" height="240" rx="18" fill="#172B35" stroke="#172B35"/><text x="475" y="363" font-size="25" fill="#B7D5CF" font-weight="400">02</text><text x="475" y="422" font-size="31" fill="white" font-weight="600">確認根因</text><text x="475" y="484" font-size="26" fill="#B7D5CF" font-weight="400">落差出在哪裡？</text><text x="475" y="524" font-size="25" fill="#B7D5CF" font-weight="400">先確認原因</text><path d="M769 440 L799 440" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="812" y="316" width="310" height="240" rx="18" fill="#172B35" stroke="#172B35"/><text x="837" y="363" font-size="25" fill="#B7D5CF" font-weight="400">03</text><text x="837" y="422" font-size="31" fill="white" font-weight="600">確認工程藍圖</text><text x="837" y="484" font-size="26" fill="#B7D5CF" font-weight="400">要改哪些部位？</text><text x="837" y="524" font-size="25" fill="#B7D5CF" font-weight="400">先確認修改計畫</text><path d="M1131 440 L1161 440" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1174" y="316" width="338" height="240" rx="18" fill="#172B35" stroke="#172B35"/><text x="1199" y="363" font-size="25" fill="#B7D5CF" font-weight="400">04</text><text x="1199" y="422" font-size="31" fill="white" font-weight="600">整理 SOP</text><text x="1199" y="484" font-size="26" fill="#B7D5CF" font-weight="400">每一步需要什麼？</text><text x="1199" y="524" font-size="25" fill="#B7D5CF" font-weight="400">逐步安排施工</text><text x="88" y="712" font-size="34" fill="#0A756A" font-weight="600">根因決定要改什麼，工程藍圖決定怎麼分派。</text></g></svg>