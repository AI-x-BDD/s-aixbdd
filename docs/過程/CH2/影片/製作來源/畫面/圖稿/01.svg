<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC, Avenir Next, sans-serif"><rect width="1600" height="900" fill="#F7F5F0" /><text x="88" y="112" font-size="48" fill="#17212B" font-weight="650">先把工作分清楚，再交給對的技能</text><text x="88" y="166" font-size="28" fill="#626D7A" font-weight="500">Skill Engineering，同時處理建立與優化</text><g data-focus="input"><path d="M88 340H366L400 374V580H88Z" fill="none" stroke="#CFD6DF" stroke-width="2" data-active-fill="#E7EDFF" data-active-stroke="#315FF4" /><path d="M366 340V374H400" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="108" y="500.8" font-size="38" fill="#17212B" font-weight="600" data-active-fill="#234DCB">一支 Skill</text><text x="110" y="309" font-size="30" fill="#626D7A" font-weight="500">建立 / 優化</text></g><g data-focus="engineering"><rect x="510" y="303" width="602" height="267" fill="#17212B" stroke="none" data-active-fill="#234DCB" /><text x="552" y="388" font-size="49" fill="#FFFFFF" font-weight="650">Skill Engineering</text><text x="552" y="451" font-size="33" fill="#FFFFFF" font-weight="500">釐清需求 → 排出工作</text><path d="M552 483H1068" fill="none" stroke="#56606E" stroke-width="2" /><text x="552" y="530" font-size="31" fill="#D8E2FF" font-weight="500">依工作委派基礎技能</text></g><g data-focus="input engineering"><path d="M426 446H480m-14 -10l14 10 -14 10" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="output"><path d="M1222 340H1478L1512 374V580H1222Z" fill="none" stroke="#CFD6DF" stroke-width="2" data-active-fill="#E7EDFF" data-active-stroke="#315FF4" /><path d="M1478 340V374H1512" fill="none" stroke="#CFD6DF" stroke-width="2" /><text x="1242" y="500.8" font-size="46" fill="#17212B" font-weight="600" data-active-fill="#234DCB">Skill</text><text x="1244" y="309" font-size="30" fill="#626D7A" font-weight="500">改寫後的</text></g><g data-focus="engineering output"><path d="M1136 446H1194m-14 -10l14 10 -14 10" fill="none" stroke="#315FF4" stroke-width="3" /></g><g data-focus="primitives"><path d="M810 570V636M480 636H1138M480 636V665M1138 636V665" fill="none" stroke="#315FF4" stroke-width="3" /><text x="400" y="713" font-size="48" fill="#315FF4" font-weight="650" data-active-fill="#234DCB">Form</text><text x="1038" y="713" font-size="48" fill="#315FF4" font-weight="650" data-active-fill="#234DCB">Deriver</text></g><text x="88" y="819" font-size="30" fill="#626D7A" font-weight="500">看分工，也看三支技能改寫後的結構。</text></g></svg>