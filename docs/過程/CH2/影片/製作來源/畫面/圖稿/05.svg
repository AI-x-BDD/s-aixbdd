<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#0A756A"/></marker></defs><g font-family="PingFang TC, Heiti TC, sans-serif"><rect width="1600" height="900" fill="#F5F3ED"/><text x="88" y="138" font-size="48" fill="#172B35" font-weight="650">主幹式開發：先讀共通判準，再依任務分流</text><text x="88" y="193" font-size="27" fill="#536975" font-weight="400">規劃變更與審查工作流程，各自有適用的規則</text><rect x="88" y="270" width="570" height="450" rx="18" fill="white" stroke="#D5DCD8"/><rect x="800" y="270" width="712" height="450" rx="18" fill="white" stroke="#D5DCD8"/><text x="118" y="322" font-size="27" fill="#BA582D" font-weight="600">改寫前</text><text x="830" y="322" font-size="27" fill="#0A756A" font-weight="600">改寫後</text><text x="124" y="415" font-size="35" fill="#172B35" font-weight="600">TBD 判準</text><text x="124" y="497" font-size="35" fill="#172B35" font-weight="600">變更規劃與技巧</text><text x="124" y="579" font-size="35" fill="#172B35" font-weight="600">工作流程審查混寫</text><path d="M681 502 L773 502" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="830" y="342" width="652" height="72" rx="18" fill="#172B35" stroke="#172B35"/><text x="854" y="391" font-size="31" fill="white" font-weight="600">SOP 負責流程與讀取時機</text><rect x="830" y="440" width="652" height="72" rx="12" fill="#DFEDE6" stroke="#DFEDE6"/><text x="854" y="488" font-size="30" fill="#0A756A" font-weight="600">TBD 判準</text><rect x="830" y="527" width="652" height="72" rx="12" fill="#DFEDE6" stroke="#DFEDE6"/><text x="854" y="575" font-size="30" fill="#0A756A" font-weight="600">變更規劃</text><rect x="830" y="614" width="652" height="72" rx="12" fill="#DFEDE6" stroke="#DFEDE6"/><text x="854" y="662" font-size="30" fill="#0A756A" font-weight="600">工作流程評估</text><text x="88" y="801" font-size="29" fill="#536975" font-weight="400">共通判準先讀；其餘依規劃或審查需求載入