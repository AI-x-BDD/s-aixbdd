<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#201D31" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#C4BDD5" letter-spacing="3">OPTIMIZATION / 先確認，再施工</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#F4F0FF" >先找原因，再決定怎麼改</text><path d="M90 205 L1510 205" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="v0"/><g data-active-only="v0"><g data-focus="s0"><rect x="450" y="280" width="1000" height="95" fill="#373249" stroke="none" /><text x="490" y="342" font-family="PingFang TC" font-size="40" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">01   預期</text><text x="900" y="342" font-family="PingFang TC" font-size="31" font-weight="400" fill="#C4BDD5" >哪裡不滿意？</text></g></g><g data-focus="v1"/><g data-active-only="v1"><g data-focus="s1"><rect x="450" y="390" width="1000" height="95" fill="#373249" stroke="none" /><text x="490" y="452" font-family="PingFang TC" font-size="40" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">02   根因</text><text x="900" y="452" font-family="PingFang TC" font-size="31" font-weight="400" fill="#C4BDD5" >差異怎麼來？</text></g></g><g data-focus="v2"/><g data-active-only="v2"><g data-focus="s2"><rect x="450" y="500" width="1000" height="95" fill="#373249" stroke="none" /><text x="490" y="562" font-family="PingFang TC" font-size="40" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">03   修改計畫</text><text x="900" y="562" font-family="PingFang TC" font-size="31" font-weight="400" fill="#C4BDD5" >確認後才動手</text></g></g><g data-focus="v3"/><g data-active-only="v3"><g data-focus="s3"><rect x="450" y="610" width="1000" height="95" fill="#373249" stroke="none" /><text x="490" y="672" font-family="PingFang TC" font-size="40" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">04   整理 SOP</text>