<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#F4F0E6" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#43574C" letter-spacing="3">EXTRACTION / 產出檔案只是其中一步</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#173F35" >拆出規則，也要接回讀取時機</text><path d="M90 205 L1510 205" fill="none" stroke="#9CA99A" stroke-width="2"/><g data-focus="step"><rect x="90" y="275" width="470" height="365" fill="#F4F0E6" stroke="#9CA99A" /><text x="115" y="325" font-family="PingFang TC" font-size="29" font-weight="600" fill="#173F35" >SOP</text><path d="M115 355 L535 355" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="115" y="398" font-family="PingFang TC" font-size="28" font-weight="400" fill="#173F35" >步驟：需要更多判斷規則</text></g><g data-focus="extract"><text x="690" y="325" font-family="PingFang TC" font-size="43" font-weight="600" fill="#173F35" data-active-fill="#9B452C">規則抽取</text><text x="690" y="380" font-family="PingFang TC" font-size="29" font-weight="400" fill="#43574C" >derive-rule</text><path d="M560 350 L660 350" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="635" y="360" font-family="PingFang TC" font-size="40" font-weight="400" fill="#173F35" >›</text></g><g data-focus="write"/><g data-active-only="write"><rect x="1100" y="275" width="410" height="235" fill="#F4F0E6" stroke="#9CA99A" /><text x="1125" y="325" font-family="PingFang TC" font-size="29" font-weight="600" fill="#173F35" >規則檔</text><path d="M1125 355 L1485 355" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="1125" y="398" font-family="PingFang TC" font-size="28" font-weight="400" fill="#173F35" >form-rule 寫好規則</text><path d="M1000 350 L1090 350" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="1060" y="360" font-family="PingFang TC" font-size="40" font-weight="400" fill="#173F35" >›</text></g><g data-focus="back"/><g data-active-only="back"><path d="M1300 530 V665 H325 V610" fill="none" stroke="#9B452C" stroke-width="7"/><path d="M313 630 L325 610 L337 630" fill="none" stroke="#9B452C" stroke-width="5"/><text x="680" y="625" font-family="PingFang TC" font-size="37" font-weight="600" fill="#9B452C" >form-sop 接回流程</text><text x="680" y="705" font-family="PingFang TC" font-size="31" font-weight="400" fill="#173F35" >交代載入時機與使用方式</text><text x="115" y="455" font-family="PingFang TC" font-size="28" font-weight="400" fill="#173F35" >讀取：何時讀、怎麼用</text></g><g data-focus="branches"/><g data-active-only="branches"><text x="90" y="795" font-family="PingFang TC" font-size="30" font-weight="400" fill="#43574C" >需要固定輸出 → 抽取樣板　／　需要自動處理 → 抽取腳本</text></g><g data-focus="existing"/><g data-active-only="existing"><text x="90" y="850" font-family="PingFang TC" font-size="30" font-weight="600" fill="#9B452C" >既有檔案只改內容 → 直接交給 Form</text></g></g></svg>
