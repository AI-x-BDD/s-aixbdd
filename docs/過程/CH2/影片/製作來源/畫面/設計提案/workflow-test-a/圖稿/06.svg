<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#F4F0E6" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#43574C" letter-spacing="3">CASE 03 / 分開的是規則責任</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#173F35" >雙鑽石：流程與三類判斷各有位置</text><path d="M90 205 L1510 205" fill="none" stroke="#9CA99A" stroke-width="2"/><g data-focus="sop"><text x="90" y="330" font-family="PingFang TC" font-size="64" font-weight="600" fill="#173F35" data-active-fill="#9B452C">主檔負責帶流程</text></g><text x="1000" y="330" font-family="PingFang TC" font-size="32" font-weight="400" fill="#43574C" >判斷回到各自的規則檔</text><g data-focus="rules"><path d="M90 470 L490 470" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="90" y="565" font-family="PingFang TC" font-size="53" font-weight="600" fill="#173F35" data-active-fill="#9B452C">模型判準</text><text x="90" y="635" font-family="PingFang TC" font-size="33" font-weight="400" fill="#43574C" >理解雙鑽石</text><path d="M90 710 L490 710" fill="none" stroke="#9CA99A" stroke-width="2"/></g><g data-focus="rules"><path d="M600 470 L1000 470" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="600" y="565" font-family="PingFang TC" font-size="53" font-weight="600" fill="#173F35" data-active-fill="#9B452C">任務分流</text><text x="600" y="635" font-family="PingFang TC" font-size="33" font-weight="400" fill="#43574C" >判斷走哪條路</text><path d="M600 710 L1000 710" fill="none" stroke="#9CA99A" stroke-width="2"/></g><g data-focus="rules"><path d="M1110 470 L1510 470" fill="none" stroke="#9CA99A" stroke-width="2"/><text x="1110" y="565" font-family="PingFang TC" font-size="53" font-weight="600" fill="#173F35" data-active-fill="#9B452C">需求分析</text><text x="1110" y="635" font-family="PingFang TC" font-size="33" font-weight="400" fill="#43574C" >分析與產出</text><path d="M1110 710 L1510 710" fill="none" stroke="#9CA99A" stroke-width="2"/></g><text x="90" y="825" font-family="PingFang TC" font-size="29" font-weight="400" fill="#43574C" >這是檔案責任的分離；不是把雙鑽石模型改成固定階段。</text></g></svg>
