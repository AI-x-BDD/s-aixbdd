<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#201D31" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#C4BDD5" letter-spacing="3">EXTRACTION / 產出檔案只是其中一步</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#F4F0FF" >拆出規則，也要接回讀取時機</text><path d="M90 205 L1510 205" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="step"><g data-focus="step"><rect x="90" y="290" width="410" height="115" fill="#373249" stroke="none" data-active-fill="#D8EF8A"/><text x="115" y="359.5" font-family="PingFang TC" font-size="34" font-weight="600" fill="#F4F0FF" data-active-fill="#201D31">SOP：需要更多規則</text></g></g><path d="M500 350 L590 350" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="extract"><g data-focus="extract"><rect x="590" y="290" width="390" height="115" fill="#373249" stroke="none" data-active-fill="#D8EF8A"/><text x="615" y="359.5" font-family="PingFang TC" font-size="34" font-weight="600" fill="#F4F0FF" data-active-fill="#201D31">derive-rule</text></g></g><g data-focus="write"/><g data-active-only="write"><path d="M980 350 L1070 350" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="write"><rect x="1070" y="290" width="440" height="115" fill="#373249" stroke="none" data-active-fill="#D8EF8A"/><text x="1095" y="359.5" font-family="PingFang TC" font-size="34" font-weight="600" fill="#F4F0FF" data-active-fill="#201D31">form-rule 寫規則</text></g></g><g data-focus="back"/><g data-active-only="back"><path d="M1290 405 V625 H295 V405" fill="none" stroke="#D8EF8A" stroke-width="7"/><path d="M283 425 L295 405 L307 425" fill="none" stroke="#D8EF8A" stroke-width="5"/><rect x="590" y="535" width="580" height="120" fill="#373249" stroke="none" /><text x="625" y="610" font-family="PingFang TC" font-size="38" font-weight="600" fill="#D8EF8A" >form-sop：接回讀取時機</text></g><g data-focus="branches"/><g data-active-only="branches"><text x="90" y="795" font-family="PingFang TC" font-size="30" font-weight="400" fill="#C4BDD5" >需要固定輸出 → 抽取樣板　／　需要自動處理 → 抽取腳本</text></g><g data-focus="existing"/><g data-active-only="existing"><text x="90" y="850" font-family="PingFang TC" font-size="30" font-weight="600" fill="#D8EF8A" >既有檔案只改內容 → 直接交給 Form</text></g></g></svg>
