<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#201D31" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#C4BDD5" letter-spacing="3">CASE 03 / 分開的是規則責任</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#F4F0FF" >雙鑽石：流程與三類判斷各有位置</text><path d="M90 205 L1510 205" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="sop"><text x="90" y="355" font-family="PingFang TC" font-size="95" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">SOP</text><text x="90" y="420" font-family="PingFang TC" font-size="36" font-weight="400" fill="#F4F0FF" >主檔帶流程</text></g><g data-focus="rules"><rect x="600" y="280" width="270" height="410" fill="#373249" stroke="none" /><path d="M625 360 L845 360" fill="none" stroke="#847B97" stroke-width="2"/><text x="625" y="465" font-family="PingFang TC" font-size="39" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">模型判準</text><text x="625" y="625" font-family="PingFang TC" font-size="29" font-weight="400" fill="#C4BDD5" >獨立規則</text></g><g data-focus="rules"><rect x="900" y="280" width="270" height="410" fill="#373249" stroke="none" /><path d="M925 360 L1145 360" fill="none" stroke="#847B97" stroke-width="2"/><text x="925" y="465" font-family="PingFang TC" font-size="39" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">任務分流</text><text x="925" y="625" font-family="PingFang TC" font-size="29" font-weight="400" fill="#C4BDD5" >獨立規則</text></g><g data-focus="rules"><rect x="1200" y="280" width="270" height="410" fill="#373249" stroke="none" /><path d="M1225 360 L1445 360" fill="none" stroke="#847B97" stroke-width="2"/><text x="1225" y="465" font-family="PingFang TC" font-size="39" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">需求分析</text><text x="1225" y="625" font-family="PingFang TC" font-size="29" font-weight="400" fill="#C4BDD5" >獨立規則</text></g><text x="90" y="825" font-family="PingFang TC" font-size="29" font-weight="400" fill="#C4BDD5" >這是檔案責任的分離；不是把雙鑽石模型改成固定階段。</text></g></svg>
