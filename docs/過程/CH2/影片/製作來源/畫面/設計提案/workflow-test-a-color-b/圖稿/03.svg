<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="PingFang TC"><rect x="0" y="0" width="1600" height="900" fill="#201D31" stroke="none" /><text x="90" y="85" font-family="PingFang TC" font-size="24" font-weight="600" fill="#C4BDD5" letter-spacing="3">OPTIMIZATION / 先確認，再施工</text><text x="90" y="168" font-family="PingFang TC" font-size="58" font-weight="600" fill="#F4F0FF" >先找原因，再決定怎麼改</text><path d="M90 205 L1510 205" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="v0"/><g data-active-only="v0"><g data-focus="s0"><text x="90" y="355" font-family="PingFang TC" font-size="80" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">01</text><text x="90" y="445" font-family="PingFang TC" font-size="47" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">預期</text><text x="90" y="502" font-family="PingFang TC" font-size="29" font-weight="400" fill="#F4F0FF" >哪裡不滿意？</text></g></g><path d="M370 425 L420 425" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="v1"/><g data-active-only="v1"><g data-focus="s1"><text x="460" y="355" font-family="PingFang TC" font-size="80" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">02</text><text x="460" y="445" font-family="PingFang TC" font-size="47" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">根因</text><text x="460" y="502" font-family="PingFang TC" font-size="29" font-weight="400" fill="#F4F0FF" >差異怎麼來？</text></g></g><path d="M740 425 L790 425" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="v2"/><g data-active-only="v2"><g data-focus="s2"><text x="830" y="355" font-family="PingFang TC" font-size="80" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">03</text><text x="830" y="445" font-family="PingFang TC" font-size="47" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">修改計畫</text><text x="830" y="502" font-family="PingFang TC" font-size="29" font-weight="400" fill="#F4F0FF" >確認後才動手</text></g></g><path d="M1110 425 L1160 425" fill="none" stroke="#847B97" stroke-width="2"/><g data-focus="v3"/><g data-active-only="v3"><g data-focus="s3"><text x="1200" y="355" font-family="PingFang TC" font-size="80" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">04</text><text x="1200" y="445" font-family="PingFang TC" font-size="47" font-weight="600" fill="#F4F0FF" data-active-fill="#D8EF8A">整理 SOP</text><text x="1200" y="502" font-family="PingFang TC" font-size="29" font-weight="400" fill="#F4F0FF" >逐步判斷部位</text></g></g><text x="90" y="810" font-family="PingFang TC" font-size="32" font-weight="400" fill="#C4BDD5" >根因與修改計畫確認，是開始施工的前提。</text></g></svg>
