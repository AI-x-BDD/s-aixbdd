<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#0A756A"/></marker></defs><g font-family="PingFang TC, Heiti TC, sans-serif"><rect width="1600" height="900" fill="#F5F3ED"/><text x="88" y="138" font-size="48" fill="#172B35" font-weight="650">檔案拆出去，流程也要接回來</text><text x="88" y="193" font-size="27" fill="#536975" font-weight="400">以新增規則為例，看一次完整的委派</text><rect x="88" y="265" width="460" height="260" rx="18" fill="white" stroke="#D5DCD8"/><text x="113" y="326" font-size="37" fill="#0A756A" font-weight="600">抽取規則</text><text x="113" y="381" font-size="28" fill="#172B35" font-weight="600">skill-derive-rule</text><text x="113" y="443" font-size="28" fill="#536975" font-weight="400">判斷要抽出哪些規則</text><text x="113" y="487" font-size="28" fill="#536975" font-weight="400">接手 SOP 的指定步驟</text><path d="M553 395 L567 395" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="574" y="265" width="460" height="260" rx="18" fill="white" stroke="#D5DCD8"/><text x="599" y="326" font-size="37" fill="#0A756A" font-weight="600">寫好規則</text><text x="599" y="381" font-size="28" fill="#172B35" font-weight="600">skill-form-rule</text><text x="599" y="443" font-size="28" fill="#536975" font-weight="400">獨立規則檔</text><text x="599" y="487" font-size="28" fill="#536975" font-weight="400">每條都有正反例</text><path d="M1039 395 L1053 395" stroke="#0A756A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1060" y="265" width="452" height="260" rx="18" fill="#DFEDE6" stroke="#D5DCD8"/><text x="1085" y="326" font-size="37" fill="#0A756A" font-weight="600">更新流程</text><text x="1085" y="381" font-size="28" fill="#172B35" font-weight="600">skill-form-sop</text><text x="1085" y="443" font-size="28" fill="#536975" font-weight="400">在適用步驟讀取</text><text x="1085" y="487" font-size="28" fill="#536975" font-weight="400">後續使用並檢查</text><rect x="88" y="612" width="850" height="130" rx="18" fill="#172B35" stroke="#172B35"/><text x="116" y="663" font-size="29" fill="white" font-weight="600">固定輸出 → 樣板抽取</text><text x="116" y="708" font-size="29" fill="#B7D5CF" font-weight="400">可交給腳本自動處理 → 腳本抽取</text><rect x="966" y="612" width="546" height="130" rx="18" fill="white" stroke="#D5DCD8"/><text x="994" y="663" font-size="30" fill="#0A756A" font-weight="600">既有部位只改內容</text><text x="994" y="708" font-size="29" fill="#172B35" font-weight="400">直接交給對應 Form</text></g></svg>